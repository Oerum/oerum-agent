name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE26: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            artifact: brain-windows-x64.zip
            os: windows-latest
            archive: zip
          - target: x86_64-unknown-linux-gnu
            artifact: brain-linux-x64.tar.gz
            os: ubuntu-latest
            archive: tar
          - target: aarch64-unknown-linux-gnu
            artifact: brain-linux-arm64.tar.gz
            os: ubuntu-latest
            archive: tar
            cross_linker: aarch64-linux-gnu-gcc
            apt: gcc-aarch64-linux-gnu
          - target: x86_64-apple-darwin
            artifact: brain-darwin-x64.tar.gz
            os: macos-latest
            archive: tar
          - target: aarch64-apple-darwin
            artifact: brain-darwin-arm64.tar.gz
            os: macos-latest
            archive: tar
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross toolchain (Linux arm64)
        if: matrix.apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Configure cross linker
        if: matrix.cross_linker != ''
        shell: bash
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<EOF
          [target.${{ matrix.target }}]
          linker = "${{ matrix.cross_linker }}"
          EOF

      - name: Build
        run: cargo build --release -p brain-cli --target ${{ matrix.target }}

      - name: Stage and package artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist staging
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN="target/${{ matrix.target }}/release/brain.exe"
            cp "$BIN" staging/
            7z a -tzip "dist/${{ matrix.artifact }}" ./staging/*
          else
            BIN="target/${{ matrix.target }}/release/brain"
            cp "$BIN" staging/
            tar -czvf "dist/${{ matrix.artifact }}" -C staging .
          fi

      - name: Compute checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          else
            shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          fi
          cat "${{ matrix.artifact }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Aggregate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          cat *.sha256 > checksums.txt
          ls -la

      - name: Check release state
        id: release_state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if is_draft="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "is_draft=$is_draft" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "is_draft=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release assets
        if: steps.release_state.outputs.exists == 'false' || steps.release_state.outputs.is_draft == 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
          fail_on_unmatched_files: true

      - name: Publish GitHub release
        if: steps.release_state.outputs.exists == 'false' || steps.release_state.outputs.is_draft == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
